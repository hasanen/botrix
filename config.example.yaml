# Example Botrix configuration.
#
# Copy this to your config location (default: /config/config.yaml) and edit.
# The config is validated at startup — invalid config prevents the app from
# starting with a descriptive error. Changes require a restart.

matrix:
  homeserver: https://matrix.example.com

  destinations:
    containers:
      room_id: "!abc123:matrix.example.com"
      enabled: true
    homelab:
      room_id: "!def456:matrix.example.com"
      enabled: true

webhooks:
  wud:
    enabled: true
    destination: containers
    msg_template: |
      Docker image update available!

      Container: ${name}
      Image: ${image.name}
      Current tag: ${image.tag.value}
      New tag: ${result.tag}

  homeassistant:
    enabled: true
    destination: homelab
    msg_template: |
      ${title}

      ${message}

# Reusable allowlists that triggers can reference by name.
access_profiles:
  ops:
    allowed_rooms:
      - "!abc123:matrix.example.com"
    allowed_users:
      - "@alice:matrix.example.com"
      - "@bob:matrix.example.com"

# Command triggers: mention the bot in a room (`@botrix deploy prod`) to call
# an HTTP webhook and reply with the result. The key is the command word and is
# matched case-insensitively. `help` is built in and cannot be used.
#
# Never put credentials in this file. Declare the secret names under `secrets`,
# reference them in header values as {{secret:NAME}}, and set the values in the
# web UI (Triggers page). Values are stored encrypted in the database.
# More header examples (API key, Basic auth, several secrets):
# https://hasanen.github.io/botrix/triggers#using-secrets-in-headers
triggers:
  deploy:
    description: Deploy a service
    enabled: true
    method: POST
    url: https://ci.example.com/hooks/deploy
    headers:
      Authorization: "Bearer {{secret:TOKEN}}"
      X-Source: botrix
    secrets: [TOKEN]
    response_template: "Deploy ${status}: ${message}"
    access_profile: ops
    # Optional inline lists override the profile's list for that dimension:
    # allowed_rooms: ["!other:matrix.example.com"]
    # allowed_users: ["@carol:matrix.example.com"]

server:
  host: "0.0.0.0"
  port: 8080
  max_body_bytes: 262144
  # Public URL at which Botrix is reachable, used for the Matrix login
  # redirect. The homeserver sends the browser back to
  # {public_url}/api/v1/matrix/callback after you authorize the bot account.
  # Required when running behind a reverse proxy; if omitted, Botrix derives
  # the callback from the request, which only works without a proxy.
  # public_url: "https://botrix.example.com"
