name: Container
on:
  pull_request:
    branches: [main]
    # Only run when something that ends up in the image changes.
    paths:
      - 'Containerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'scripts/container-test.sh'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/container.yml'
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container-build:
    name: Container image build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only (never pushed from PRs). Catches Containerfile breakage such
      # as a builder/runtime glibc mismatch before a release tag does.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: botrix:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image
        env:
          CONTAINER_ENGINE: docker
        run: scripts/container-test.sh botrix:test
