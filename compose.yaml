# Local development / testing only. Do not use these placeholder secrets in
# production: generate real ones (e.g. `openssl rand -base64 48`).
services:
  botrix:
    image: botrix:dev
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    volumes:
      - ./dev-data:/data
      - ./dev-config:/config:ro
    environment:
      # BOTRIX_SESSION_SECRET must be at least 32 bytes.
      - BOTRIX_SESSION_SECRET=dev-only-session-secret-change-me-0123456789
      - BOTRIX_CRYPTO_PASSPHRASE=dev-only-crypto-passphrase-change-me
      # Plain http://localhost has no TLS, so allow non-Secure cookies. Remove
      # this behind an HTTPS reverse proxy.
      - BOTRIX_INSECURE_COOKIES=1
      - RUST_LOG=info
    restart: unless-stopped
    # Hardening (plan §16.9). Botrix only writes to /data, so it runs fine with
    # no capabilities and a read-only root filesystem.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "botrix", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
