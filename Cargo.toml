[workspace]
resolver = "2"
members = [
    "crates/botrix-common",
    "crates/botrix-frontend",
    "crates/botrix-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Botrix Contributors"]
repository = "https://github.com/hasanen/botrix"
# Botrix ships as a container image, not as crates on crates.io.
publish = false

[workspace.dependencies]
# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Server-only
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde_yaml = "0.9"
# App DB uses rusqlite, which must resolve to the same libsqlite3-sys as
# matrix-sdk-sqlite so a single native sqlite3 library is linked (plan §19.5).
# rusqlite 0.40 / r2d2_sqlite 0.35 -> libsqlite3-sys 0.38, matching matrix-sdk 0.19.
rusqlite = { version = "0.40", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
# matrix-sdk 0.19 fixes the matrix-sdk-base / matrix-sdk-crypto advisories
# (RUSTSEC-2025-0135, -2026-0159, -2026-0318) present in 0.14. Its TLS feature
# is `rustls-aws-lc-rs`; its matrix-sdk-sqlite requires rusqlite 0.40.
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs"] }
# Application-level OAuth-token encryption at rest (§16.1). Both crates are
# already in the resolved dependency tree (pulled transitively by matrix-sdk /
# vodozemac), so declaring them directly reuses the existing versions without
# adding a new crate to the build.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.12"
# For building/parsing the OAuth redirect URI. Already in the tree via
# matrix-sdk, so this adds no new crate.
url = "2"
argon2 = "0.5"
tower-sessions = "0.14"
rand = "0.8"
sha2 = "0.10"
constant_time_eq = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
axum_csrf = "0.12"
anyhow = "1"
unicode-normalization = "0.1"
time = "0.3"
async-trait = "0.1"
# Already resolved in Cargo.lock via matrix-sdk (reqwest 0.13.5, ipnet 2.12.2);
# declared directly for outbound command-trigger webhooks and SSRF checks.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
ipnet = "2"

# Frontend-only
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http"] }
leptos_router = { version = "0.7" }
web-sys = "0.3"
