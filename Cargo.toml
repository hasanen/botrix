[workspace]
resolver = "2"
members = [
    "crates/botrix-common",
    "crates/botrix-frontend",
    "crates/botrix-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Botrix Contributors"]
repository = "https://github.com/hasanen/botrix"

[workspace.dependencies]
# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Server-only
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde_yaml = "0.9"
# App DB uses rusqlite (same libsqlite3-sys 0.38 as matrix-sdk-sqlite, so a
# single native sqlite3 library is linked — avoids the plan §19.5 conflict).
rusqlite = { version = "0.37", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
# rusqlite 0.37 -> libsqlite3-sys 0.35, matching matrix-sdk-sqlite so a single
# native sqlite3 is linked.
matrix-sdk = { version = "0.14", default-features = false, features = ["e2e-encryption", "sqlite", "bundled-sqlite", "rustls-tls"] }
# Application-level OAuth-token encryption at rest (§16.1). Both crates are
# already in the resolved dependency tree (pulled transitively by matrix-sdk /
# vodozemac), so declaring them directly reuses the existing versions without
# adding a new crate to the build.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.12"
argon2 = "0.5"
tower-sessions = "0.14"
rand = "0.8"
sha2 = "0.10"
constant_time_eq = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
axum_csrf = "0.12"
anyhow = "1"
unicode-normalization = "0.1"
time = "0.3"
async-trait = "0.1"

# Frontend-only
leptos = { version = "0.7", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http"] }
leptos_router = { version = "0.7" }
web-sys = "0.3"
