[graph]
# Lint the entire workspace
all-features = false
no-default-features = false

[advisories]
# Deny crates with security vulnerabilities
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Fail on unmaintained crates we depend on directly. Unmaintained crates that
# only arrive transitively (currently paste, unsafe-libyaml, proc-macro-error2,
# anymap2, derivative) cannot be fixed from this repository; they are tracked in
# the implementation plan and go away with upstream upgrades. Vulnerabilities
# are always denied, at any depth.
unmaintained = "workspace"
ignore = [
    # Review by 2027-01-09 (cargo-deny has no expiry, so this is only a reminder).
    # Remove once matrix-sdk-sqlite and r2d2_sqlite release rusqlite 0.41
    # support; the Dependabot matrix-sqlite group will propose it.
    { id = "RUSTSEC-2026-0459", reason = "local-only exposure (needs attacker-crafted db + -wal pair in the data dir); fix is libsqlite3-sys >=0.39 / rusqlite 0.41 but matrix-sdk-sqlite 0.19.1 and r2d2_sqlite 0.35.0 still require rusqlite 0.40" },
]

[licenses]
version = 2
# Allow permissive licenses; deny GPL and non-commercial
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    # Mozilla CA bundle data (webpki-roots), a permissive data license.
    "CDLA-Permissive-2.0",
]

[bans]
# Deny duplicate versions of the same crate if avoidable
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path with no version, which
# cargo-deny would otherwise report as a `*` wildcard.
allow-wildcard-paths = true
deny = []

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"
