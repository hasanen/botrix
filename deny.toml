[graph]
# Lint the entire workspace
all-features = false
no-default-features = false

[advisories]
# Deny crates with security vulnerabilities
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[licenses]
version = 2
# Allow permissive licenses; deny GPL and non-commercial
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
]

[bans]
# Deny duplicate versions of the same crate if avoidable
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"
